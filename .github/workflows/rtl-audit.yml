name: RTL & overflow audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright + Chromium
        run: |
          npm init -y
          npm i -D playwright
          npx playwright install --with-deps chromium

      - name: Run RTL / overflow audit
        id: audit
        continue-on-error: true
        run: node test/rtl-audit.js

      - name: Commit report back to repo
        if: always()
        run: |
          git config user.name "rtl-audit-bot"
          git config user.email "actions@github.com"
          git add -f test/REPORT.md
          git commit -m "chore: RTL audit report [skip ci]" || { echo "no change"; exit 0; }
          git pull --rebase origin main || true
          git push origin HEAD:main || echo "push skipped"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl-screenshots
          path: test/shots/
          if-no-files-found: ignore

      - name: Fail if audit failed
        if: steps.audit.outcome == 'failure'
        run: exit 1
